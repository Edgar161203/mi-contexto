name: Briefing diario

on:
  schedule:
    # 7:00am hora Mérida (UTC-4) de lunes a viernes = 11:00 UTC
    - cron: '0 11 * * 1-5'
  workflow_dispatch: {}

jobs:
  briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar cliente MCP
        run: npm install @modelcontextprotocol/sdk

      - name: Consultar mi-herramienta vía MCP de Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/consultar-mi-herramienta.mjs > mi-herramienta-estado.txt

      - name: Generar briefing.md con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 <<'EOF'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone, timedelta

          def leer(nombre):
              with open(nombre, "r", encoding="utf-8") as f:
                  return f.read()

          quien_soy = leer("quien-soy.md")
          que_hago = leer("que-hago.md")
          en_que_estoy = leer("en-que-estoy.md")
          estado_mi_herramienta = leer("mi-herramienta-estado.txt").strip()

          hoy = datetime.now(timezone(timedelta(hours=-4))).strftime("%Y-%m-%d")

          prompt = f"""Hoy es {hoy}. Estos son los archivos de contexto de Edgar:

          --- quien-soy.md ---
          {quien_soy}

          --- que-hago.md ---
          {que_hago}

          --- en-que-estoy.md ---
          {en_que_estoy}

          Este es el estado real de su edge function mi-herramienta, obtenido justo ahora vía MCP de Supabase:
          {estado_mi_herramienta}

          Escribe un briefing corto (5-8 líneas), tono cercano y merideño, dirigido a Edgar. Debe incluir:
          1) la fecha de hoy y un saludo,
          2) un recordatorio de UNA de sus 3 tareas manuales del negocio (registro de clientes/ventas, responder preguntas repetidas, o agendar citas de cambio de aceite) que podría ir automatizando, rotando cuál menciona cada día,
          3) una mención breve del estado de mi-herramienta que te acaban de confirmar por MCP,
          4) una frase corta de ánimo sobre su meta de ser programador.
          Responde solo con el texto del briefing, sin comentarios extra."""

          api_key = os.environ["GEMINI_API_KEY"]
          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key={api_key}"
          body = json.dumps({
              "contents": [{"parts": [{"text": prompt}]}]
          }).encode("utf-8")

          req = urllib.request.Request(
              url, data=body, headers={"Content-Type": "application/json"}, method="POST"
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print("ERROR", e.code, e.read().decode("utf-8"))
              raise

          texto = data["candidates"][0]["content"]["parts"][0]["text"]

          with open("briefing.md", "w", encoding="utf-8") as f:
              f.write(texto.strip() + "\n")
          EOF

      - name: Commit y push del briefing
        run: |
          git config user.name "briefing-bot"
          git config user.email "actions@github.com"
          git add briefing.md
          git diff --staged --quiet || git commit -m "Briefing diario automático"
          git push
