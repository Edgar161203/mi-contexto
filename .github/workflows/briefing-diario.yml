name: Briefing diario

on:
  schedule:
    # 7:00am hora Mérida (UTC-4) de lunes a viernes = 11:00 UTC
    - cron: '0 11 * * 1-5'
  workflow_dispatch: {}

jobs:
  briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generar briefing.md con Claude Code + MCP de Supabase
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          HOY=$(TZ='America/Caracas' date +%Y-%m-%d)
          QUIEN_SOY=$(cat quien-soy.md)
          QUE_HAGO=$(cat que-hago.md)
          EN_QUE_ESTOY=$(cat en-que-estoy.md)

          MCP_CONFIG=$(cat <<JSON
          {"mcpServers":{"supabasemcp":{"command":"npx","args":["-y","@supabase/mcp-server-supabase","--project-ref=eccpmhaiowuiiojatidr","--read-only"],"env":{"SUPABASE_ACCESS_TOKEN":"$SUPABASE_ACCESS_TOKEN"}}}}
          JSON
          )

          PROMPT="Hoy es $HOY. Estos son los archivos de contexto de Edgar:

          --- quien-soy.md ---
          $QUIEN_SOY

          --- que-hago.md ---
          $QUE_HAGO

          --- en-que-estoy.md ---
          $EN_QUE_ESTOY

          Primero usa la herramienta MCP de Supabase para listar las edge functions del proyecto y confirma que 'mi-herramienta' sigue activa.

          Luego escribe un briefing corto (5-8 líneas), tono cercano y merideño, dirigido a Edgar. Debe incluir:
          1) la fecha de hoy y un saludo,
          2) un recordatorio de UNA de sus 3 tareas manuales del negocio (registro de clientes/ventas, responder preguntas repetidas, o agendar citas de cambio de aceite) que podría ir automatizando, rotando cuál menciona cada día,
          3) una confirmación de que su edge function mi-herramienta sigue viva (según lo que acabas de consultar por MCP),
          4) una frase corta de ánimo sobre su meta de ser programador.
          Responde solo con el texto del briefing, sin comentarios extra."

          claude -p "$PROMPT" \
            --mcp-config "$MCP_CONFIG" \
            --strict-mcp-config \
            --allowedTools "mcp__supabasemcp__list_edge_functions" \
            --output-format text \
            > briefing.md

      - name: Commit y push del briefing
        run: |
          git config user.name "briefing-bot"
          git config user.email "actions@github.com"
          git add briefing.md
          git diff --staged --quiet || git commit -m "Briefing diario automático"
          git push
