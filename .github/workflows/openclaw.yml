name: OpenClaw

on:
  schedule:
    # 7:30am hora Mérida (UTC-4) de lunes a viernes = 11:30 UTC
    - cron: '30 11 * * 1-5'
  workflow_dispatch: {}

jobs:
  openclaw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar cliente MCP
        run: npm install @modelcontextprotocol/sdk

      - name: Correr el OpenClaw (memoria + herramienta + Gemini + Gmail)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: node scripts/enviar-openclaw.mjs

      - name: Commit y push del registro de ejecución
        run: |
          git config user.name "openclaw-bot"
          git config user.email "actions@github.com"
          git add memory/log.md
          git diff --staged --quiet || git commit -m "OpenClaw: registro de corrida automática"
          git push
